<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fright House — version comparison</title><style>@font-face{font-family:type;src:url('../vendor/fonts/SpecialElite-Regular.ttf')}*{box-sizing:border-box}body{margin:0;background:#141b19;color:#d6c7a4;font:15px/1.6 type,monospace}header,main{max-width:1450px;margin:auto;padding:24px}h1{font-weight:normal;font-size:32px}a{color:#d8b775}select{font:inherit;background:#2d3831;color:#e5d4aa;padding:12px;border:1px solid #8d7952;max-width:100%}.controls{display:flex;gap:24px;flex-wrap:wrap}.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:15px 0 35px}figure{margin:0;background:#202b25;border:1px solid #495046}img{width:100%;display:block}figcaption{padding:10px}p{max-width:1000px}.metric{color:#b5bda9;font-size:12px}.notice{padding:14px;border-left:3px solid #aa7a49;background:#222b25}@media(max-width:700px){.pair{grid-template-columns:1fr}h1{font-size:25px}}</style></head><body><header><h1>Fright House — version comparison</h1><p>Matched camera views from the baseline and each accepted refinement. Compare construction, lighting and clutter as well as detail. Animation and sound are best judged in the playable preview.</p><p><a href="../index.html">PLAY / TEST CHECKPOINTS</a> · <a href="tour.html">SCENE TOUR</a></p><div class="controls"><label>Before <select id="before"></select></label><label>After <select id="after"></select></label></div><p class="notice" id="notes"></p></header><main id="frames"></main><script type="module">
const {versions}=await(await fetch('./iterations.json')).json();const ids=['canopy','clown','fish','teddy','bag-table','shoe-table','tape-table','maintenance'];for(const id of ['before','after']){const select=document.getElementById(id);for(const v of versions){const option=document.createElement('option');option.value=v.id;option.textContent=v.id.toUpperCase()+' / '+v.title;select.append(option);}select.onchange=render;}document.getElementById('after').value=versions.at(-1).id;
async function render(){const a=document.getElementById('before').value,b=document.getElementById('after').value;document.getElementById('notes').textContent=versions.find(v=>v.id===b).note;const reports=await Promise.all([a,b].map(v=>fetch('../validation/iterations/'+v+'/report.json').then(r=>r.json())));document.getElementById('frames').replaceChildren();for(const name of ids){const title=document.createElement('h2');title.textContent=name.replaceAll('-',' ').toUpperCase();document.getElementById('frames').append(title);const pair=document.createElement('div');pair.className='pair';[a,b].forEach((v,i)=>{const f=document.createElement('figure'),img=document.createElement('img');img.src='../validation/iterations/'+v+'/'+name+'.png';img.alt=v+' '+name;img.loading='lazy';const caption=document.createElement('figcaption');caption.textContent=v.toUpperCase();const metric=document.createElement('div');metric.className='metric';const s=reports[i].observations.find(o=>o.name===name).state;metric.textContent=s.draws+' draw calls · '+s.tris.toLocaleString()+' triangles in this review view';caption.append(metric);f.append(img,caption);pair.append(f);});document.getElementById('frames').append(pair);}}render();
</script></body></html>
