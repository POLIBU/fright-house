<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Investigator animation preview</title><style>body{background:#131d1a;color:#ead7b3;font:16px 'Courier New',monospace;max-width:1000px;margin:30px auto;padding:20px}canvas{width:100%;image-rendering:pixelated;background:#26332e}a{color:#e2af70}button{padding:12px;background:#c6a167;border:0;font:inherit}img{max-width:100%}</style><a href="../../two-d/test.html">← LEVEL SELECT</a><h1>The investigator in motion</h1><p>Four walking frames in each direction, plus take-off, rising, falling and landing poses for both sides. The in-game sprite is 40 pixels tall, up from 31.</p><button id="toggle">PAUSE PREVIEW</button><canvas id="preview" width="600" height="280"></canvas><p><a href="../../two-d/level-2.html">Try the new cupboard in Level 2</a> · <a href="../../two-d/level-3.html?floor=3">Try Floor 4 machinery and jumping</a></p><script type="module">
import {drawPlayer} from '../../two-d/levels/temporary-player.js';const c=document.querySelector('canvas'),x=c.getContext('2d');let t=0,last=performance.now(),paused=false;document.querySelector('button').onclick=()=>{paused=!paused;document.querySelector('button').textContent=paused?'RESUME PREVIEW':'PAUSE PREVIEW';};function frame(now){if(!paused)t+=(now-last)/1000;last=now;x.clearRect(0,0,600,280);x.fillStyle='#e5ccab';x.font='12px monospace';x.textAlign='center';['down','left','up','right'].forEach((face,i)=>{x.fillText(face.toUpperCase(),75+i*150,20);x.save();x.translate(75+i*150,116);x.scale(2,2);drawPlayer(x,{x:0,y:0,face,walk:t*9},true);x.restore();});for(let side=0;side<2;side++){const f=Math.floor(t*4)%4,s={face:side?'right':'left',grounded:f===3,vy:f<2?-100:100,jumpAge:f===0?0:.2,landingAge:f===3?.1:0,x:0,y:0};x.fillText(['TAKE-OFF','RISING','FALLING','LANDING'][f],180+side*240,154);x.save();x.translate(180+side*240,265);x.scale(2,2);drawPlayer(x,s,false);x.restore();}requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
